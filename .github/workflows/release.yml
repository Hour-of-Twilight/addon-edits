name: Create Release Zips

# Triggers when you push a tag like "v1.0.0"
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      # Builds one zip per entry in .github/addons.yml and writes addons.json alongside them.
      # The launcher reads addons.json, so anything not listed there is invisible to players.
      - name: Build addon zips and addons.json
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
        run: |
          mkdir -p dist
          python3 .github/build-addons.py .github/addons.yml dist "$RELEASE_TAG"

      - name: Show what was built
        run: ls -la dist && cat dist/addons.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Automated release of addon packs for Hour of Twilight.

            The launcher picks these up on its own. To install by hand, download a zip and
            extract it into your WoW Interface/AddOns/ folder.
          files: |
            dist/*.zip
            dist/addons.json
